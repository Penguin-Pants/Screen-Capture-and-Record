<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Capture and Record</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .container { padding: 16px; }

    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .header img { width: 32px; height: 32px; }
    .header h1 { font-size: 16px; font-weight: 700; }

    .actions { display: grid; gap: 8px; }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 11px 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .action-btn:hover:not(:disabled), .action-btn:focus-visible {
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.6);
      outline: none;
    }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .action-btn .icon { font-size: 20px; width: 24px; text-align: center; }
    .action-btn .text { flex: 1; }
    .action-btn .title { font-size: 14px; font-weight: 600; }
    .action-btn .desc { font-size: 11px; opacity: 0.85; }
    .shortcut {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.25);
      white-space: nowrap;
    }
    .shortcut:empty { display: none; }

    .notice {
      display: none;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      font-size: 12px;
    }
    .notice.show { display: block; }

    .after {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }
    .after select {
      padding: 4px 6px;
      border: none;
      border-radius: 6px;
      font: inherit;
      color: #222;
      background: #fff;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 12px;
    }
    .footer button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      opacity: 0.85;
      cursor: pointer;
    }
    .footer button:hover { opacity: 1; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="">
      <h1>Screen Capture and Record</h1>
    </div>

    <div class="actions">
      <button class="action-btn" data-capture="area">
        <span class="icon">✂️</span>
        <span class="text"><span class="title">Selected area</span><br><span class="desc">Drag to select a part of the page</span></span>
        <span class="shortcut" data-command="capture-area"></span>
      </button>
      <button class="action-btn" data-capture="visible">
        <span class="icon">🖥️</span>
        <span class="text"><span class="title">Visible area</span><br><span class="desc">What you see in the tab now</span></span>
        <span class="shortcut" data-command="capture-visible"></span>
      </button>
      <button class="action-btn" data-capture="fullpage">
        <span class="icon">📄</span>
        <span class="text"><span class="title">Full page</span><br><span class="desc">The complete page, top to bottom</span></span>
        <span class="shortcut" data-command="capture-fullpage"></span>
      </button>
      <button class="action-btn" id="startRecording">
        <span class="icon">🎥</span>
        <span class="text"><span class="title">Record screen</span><br><span class="desc">Screen, window or tab, with microphone</span></span>
      </button>
      <button class="action-btn" id="openEditor">
        <span class="icon">✏️</span>
        <span class="text"><span class="title">Open editor</span><br><span class="desc">Edit an image file or the clipboard</span></span>
      </button>
    </div>

    <div class="notice" id="restrictedNotice">Firefox does not let extensions capture this page. Try a normal web page.</div>

    <label class="after">
      <span>After capture</span>
      <select id="afterCapture">
        <option value="editor">Open in editor</option>
        <option value="download">Save to Downloads</option>
        <option value="clipboard">Copy to clipboard</option>
      </select>
    </label>

    <div class="footer">
      <button id="openFolder">📁 Downloads folder</button>
      <button id="openOptions">⚙️ Settings</button>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
